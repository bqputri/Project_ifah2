<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Cat Ears -->
  <polygon points="120,210 170,85 230,180" fill="#FFEDD5"/>
  <polygon points="392,210 342,85 282,180" fill="#FFEDD5"/>
  <!-- Inner Ears -->
  <polygon points="138,195 172,115 215,175" fill="#F472B6"/>
  <polygon points="374,195 340,115 297,175" fill="#F472B6"/>

  <!-- Cat Head -->
  <circle cx="256" cy="260" r="140" fill="#FFFDF0" filter="url(#shadow)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="185" cy="295" rx="28" ry="18" fill="#F9A8D4" opacity="0.85"/>
  <ellipse cx="327" cy="295" rx="28" ry="18" fill="#F9A8D4" opacity="0.85"/>

  <!-- Cat Eyes -->
  <ellipse cx="195" cy="245" rx="20" ry="26" fill="#292524"/>
  <ellipse cx="317" cy="245" rx="20" ry="26" fill="#292524"/>
  <!-- Eye Sparkles -->
  <circle cx="190" cy="236" r="7" fill="#FFFFFF"/>
  <circle cx="312" cy="236" r="7" fill="#FFFFFF"/>
  <circle cx="202" cy="254" r="3.5" fill="#FFFFFF"/>
  <circle cx="324" cy="254" r="3.5" fill="#FFFFFF"/>

  <!-- Cat Nose -->
  <polygon points="256,282 248,272 264,272" fill="#EC4899"/>

  <!-- Cute Mouth -->
  <path d="M 240,285 Q 248,295 256,285 Q 264,295 272,285" fill="none" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>

  <!-- Cute Paw Motif / Keyboard keys -->
  <g opacity="0.95">
    <ellipse cx="256" cy="430" rx="22" ry="16" fill="#FFFFFF"/>
    <circle cx="230" cy="406" r="8" fill="#FFFFFF"/>
    <circle cx="256" cy="396" r="9" fill="#FFFFFF"/>
    <circle cx="282" cy="406" r="8" fill="#FFFFFF"/>
  </g>
</svg>
